plugins {
	// Loom for unobfuscated Minecraft (26.x): uses Mojang's official names, no remapping.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// One jar for every supported Minecraft version (docs/PORTING.md, "One jar for every version"). Each version is still
// built and tested on its own (-Pminecraft_version), and every build must produce the same bytes:
// tools/CompareJars.java checks that in CI. So nothing in the jar may depend on the version it was built against.
def supportedMinecraft = project.supported_minecraft_versions.split(',')*.trim()
if (!(project.minecraft_version in supportedMinecraft)) {
	throw new GradleException("Minecraft ${project.minecraft_version} is not in supported_minecraft_versions (${supportedMinecraft.join(', ')}) in gradle.properties")
}
// "26.3" (or "26.3-26.4" for two versions): in the jar name and version, and in the manifest instead of the version Loom
// built against.
def minecraftRange = supportedMinecraft.size() == 1 ? supportedMinecraft[0] : "${supportedMinecraft.first()}-${supportedMinecraft.last()}"
// fabric.mod.json "minecraft" dependency: ["~26.3"], or one range per version, any one of which must match. "~26.3" is ">=26.3 <26.4-",
// so each version's releases (26.3, 26.3.1, ...) are accepted and its snapshots and pre-releases, which Fabric Loader
// orders before the release (26.3-pre.1 < 26.3), are not; the "-" also keeps out the next version's snapshots.
def minecraftDependency = '[' + supportedMinecraft.collect { "\"~${it}\"" }.join(', ') + ']'

version = "${project.mod_version}+mc${minecraftRange}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft, Fabric and Mojang repositories automatically.
	maven {
		name = 'TerraformersMC (Mod Menu)'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
	// Other mods for the compatibility smoke test (-Pcompat=true), never bundled or required.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

// Mod Menu (optional, FR-12.3): compiled against, never bundled or required. One version per Minecraft version.
def modMenuVersions = ['26.3': '21.0.0']
def modMenuVersion = modMenuVersions[project.minecraft_version]
if (modMenuVersion == null) {
	throw new GradleException("No Mod Menu version for Minecraft ${project.minecraft_version}: add one to modMenuVersions in build.gradle")
}

// Client game tests (src/gametest): launch the real game and drive it. Run with ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "soundsculptor-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Test-only helpers whose code differs between Minecraft versions: src/gametest/versions/<minecraft_version>/java, one
// copy per version with the same class names and public API. Main code has no such folder: it must compile to the same
// bytes on every version (docs/PORTING.md).
def gametestVersionSources = file("src/gametest/versions/${project.minecraft_version}/java")
if (!gametestVersionSources.isDirectory()) {
	throw new GradleException("No version-specific game test sources for Minecraft ${project.minecraft_version}: expected ${gametestVersionSources}")
}
sourceSets.matching { it.name == 'gametest' }.configureEach {
	java.srcDir gametestVersionSources
}

// -Pcompat=true runs the compatibility smoke test (PRD 8.1, 11.5) with Sodium, Iris and Sound Physics Remastered
// installed, and only that test: the rest of the suite measures vanilla rendering and sound. -Pgametests=<Name>,<Name>
// runs only the named client game tests (class names in soundsculptor.gametest), e.g.
// -Pgametests=PrecedenceMatrixClientGameTest. Both keep only those entries in the game test mod's fabric.mod.json.
def compat = project.findProperty('compat') == 'true'
def onlyGametests = compat ? ['CompatSmokeClientGameTest']
		: (project.findProperty('gametests') ?: '').toString().split(',')*.trim().findAll { !it.isEmpty() }
tasks.matching { it.name == 'processGametestResources' }.configureEach { task ->
	def keep = onlyGametests.collect { "soundsculptor.gametest.${it}".toString() }
	task.inputs.property 'onlyGametests', keep.join(',')
	if (!keep.isEmpty()) {
		task.doLast { t ->
			File file = new File(t.destinationDir, 'fabric.mod.json')
			def json = new groovy.json.JsonSlurper().parse(file)
			List<String> listed = json.entrypoints['fabric-client-gametest']
			def unknown = keep.findAll { !(it in listed) }
			if (!unknown.isEmpty()) {
				throw new GradleException("Not client game tests in src/gametest/resources/fabric.mod.json: ${unknown.join(', ')}")
			}
			json.entrypoints['fabric-client-gametest'] = listed.findAll { it in keep }
			file.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
		}
	}
}
// On CI the game gets no OpenGL context from GLX under Xvfb and vanilla falls back to Vulkan, but Sodium and Iris need
// OpenGL. So with -Pcompat=true Loom does not start its own Xvfb (8-bit color); the CI job runs Gradle inside xvfb-run
// with a 24-bit screen and SDL_VIDEO_FORCE_EGL=1, which gives Mesa's OpenGL (.github/workflows/build.yml).
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
	if (compat) {
		it.useXvfb.set(false)
	}
}

// Game tests run like a release build: no per-sound log lines (M1's SoundLogger), so timings are not distorted.
// -Psoak=<seconds> lengthens the stress test's soak phase (PRD 11.2 step 5: 1800 for the full 30 minutes).
loom {
	runs {
		matching { it.name == 'clientGameTest' }.configureEach {
			vmArg '-Dsoundsculptor.logSounds=false'
			vmArg "-Dsoundsculptor.soakSeconds=${project.findProperty('soak') ?: '20'}"
			// -Pscreenshots=<folder> also saves the mod page screenshots there (ModPageScreenshotsClientGameTest).
			vmArg "-Dsoundsculptor.screenshotsDir=${project.hasProperty('screenshots') ? file(project.property('screenshots')).absolutePath : ''}"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:${modMenuVersion}"
	// -Pmodmenu=true runs the dev client and the game tests with Mod Menu installed.
	if (project.findProperty('modmenu') == 'true') {
		localRuntime "com.terraformersmc:modmenu:${modMenuVersion}"
	}
	// -Pcompat=true: pinned 26.3 builds from Modrinth. Iris 1.11.7 is the newest Iris for 26.3, and Sodium beta.4 and later
	// declare that they break it (Iris <= 1.11.7, then <= 1.12.0), so Sodium stays at beta.3, the newest one Iris loads with.
	if (compat) {
		localRuntime 'maven.modrinth:sodium:mc26.3-0.9.3-beta.3-fabric'
		localRuntime 'maven.modrinth:iris:1.11.7+26.3-fabric'
		localRuntime 'maven.modrinth:sound-physics-remastered:fabric-1.5.4+26.3'
	}

	// Pure-logic unit tests that run without Minecraft (PRD 7.6).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def props = [version: project.version]
	inputs.properties props
	inputs.property 'minecraftDependency', minecraftDependency

	filesMatching('fabric.mod.json') {
		expand props
		// The source keeps a string placeholder so it stays valid JSON; the dependency is a JSON array.
		filter { String line -> line.replace('"@MINECRAFT_DEPENDENCY@"', minecraftDependency) }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE') {
		rename { "${it}_${projectName}" }
	}

	// After building the jar, Loom writes the Minecraft version it compiled against into the manifest
	// (Fabric-Minecraft-Version; informational, Fabric Loader does not read it). The jar is the same for every supported
	// version, so this action, which runs after Loom's, names the range instead. Entries keep their order and timestamps.
	def manifestMinecraft = minecraftRange
	inputs.property 'manifestMinecraft', manifestMinecraft
	doLast { task ->
		File jarFile = task.archiveFile.get().asFile
		File rewritten = new File(jarFile.parentFile, jarFile.name + '.tmp')
		new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
			new java.util.zip.ZipOutputStream(new FileOutputStream(rewritten)).withCloseable { out ->
				for (java.util.zip.ZipEntry entry : zip.entries().toList()) {
					byte[] bytes = zip.getInputStream(entry).bytes
					if (entry.name == 'META-INF/MANIFEST.MF') {
						def manifest = new java.util.jar.Manifest(new ByteArrayInputStream(bytes))
						if (manifest.mainAttributes.getValue('Fabric-Minecraft-Version') == null) {
							throw new GradleException('Loom did not write Fabric-Minecraft-Version: check the order of the jar task actions')
						}
						manifest.mainAttributes.putValue('Fabric-Minecraft-Version', manifestMinecraft)
						def buffer = new ByteArrayOutputStream()
						manifest.write(buffer)
						bytes = buffer.toByteArray()
					}
					def copy = new java.util.zip.ZipEntry(entry.name)
					copy.time = entry.time
					out.putNextEntry(copy)
					out.write(bytes)
					out.closeEntry()
				}
			}
		}
		java.nio.file.Files.move(rewritten.toPath(), jarFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
}

// PRD 9.4: the jar stays under 1 MB and bundles no libraries: nothing but the mod's own classes and assets, its metadata
// and the license. Runs with ./gradlew build (check).
def licenseEntry = "LICENSE_${project.name}".toString()
def checkJarContents = tasks.register('checkJarContents') {
	def jarFile = tasks.named('jar').flatMap { it.archiveFile }
	inputs.file jarFile
	doLast {
		File file = jarFile.get().asFile
		if (file.length() >= 1024 * 1024) {
			throw new GradleException("${file.name} is ${file.length()} bytes; PRD 9.4 keeps the jar under 1 MB")
		}
		def allowed = ['META-INF/', 'META-INF/MANIFEST.MF', 'fabric.mod.json', 'soundsculptor.mixins.json', 'assets/', licenseEntry]
		List<String> names = new java.util.zip.ZipFile(file).withCloseable { zip -> zip.entries().toList()*.name }
		def unexpected = names.findAll { !(it in allowed || it.startsWith('soundsculptor/') || it.startsWith('assets/soundsculptor/')) }
		if (!unexpected.isEmpty()) {
			throw new GradleException("${file.name} has files that are not Sound Sculptor's own (PRD 9.4: no bundled libraries): ${unexpected.join(', ')}")
		}
		if (!(licenseEntry in names)) {
			throw new GradleException("${file.name} has no ${licenseEntry}")
		}
	}
}
tasks.named('check') {
	dependsOn checkJarContents
}
